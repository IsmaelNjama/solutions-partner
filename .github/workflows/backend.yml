name: Backend CI

on:
  push:
    branches: ["ecs-deploy"]
  pull_request:
    branches: ["ecs-deploy"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  RUN_TESTS: "false"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Syntax check
        run: uv run python -m compileall app

      - name: Check whether tests are enabled
        id: tests
        shell: bash
        run: |
          if [[ "${{ env.RUN_TESTS }}" == "true" ]] || find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.tests.outputs.enabled == 'true'
        run: uv run pytest

      - name: Skip tests for now
        if: steps.tests.outputs.enabled != 'true'
        run: echo "No test suite detected; skipping pytest until tests are added. Set RUN_TESTS=true to force execution when ready."

  aws:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
