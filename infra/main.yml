AWSTemplateFormatVersion: '2010-09-09'
Description: 'Solutions Partner ECS Fargate + ALB'

Parameters:
  FunctionName:
    Type: String
    Default: search-companion

  ImageUri:
    Type: String
    Description: ECR image URI for the ECS task

  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing API keys

Resources:

  # -------------------------------------------------------
  # IAM
  # -------------------------------------------------------
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  # -------------------------------------------------------
  # ECS Cluster
  # -------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${FunctionName}-cluster"

  # -------------------------------------------------------
  # CloudWatch Log Group
  # -------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${FunctionName}"
      RetentionInDays: 30

  # -------------------------------------------------------
  # Task Definition
  # -------------------------------------------------------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${FunctionName}-task"
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${FunctionName}-container"
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: APP_AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: SECRET_ARN
              ValueFrom: !Ref SecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # -------------------------------------------------------
  # ALB
  # -------------------------------------------------------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${FunctionName}-alb"
      Scheme: internet-facing
      Subnets:
        - Fn::ImportValue: !Sub "${FunctionName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${FunctionName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${FunctionName}-ALBSecurityGroupId"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${FunctionName}-tg"
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${FunctionName}-VpcId"
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # -------------------------------------------------------
  # ECS Service
  # -------------------------------------------------------
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub "${FunctionName}-service"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${FunctionName}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${FunctionName}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${FunctionName}-ECSSecurityGroupId"
      LoadBalancers:
        - ContainerName: !Sub "${FunctionName}-container"
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApiUrl:
    Description: "ALB DNS — append your route paths (e.g. /docs, /health)"
    Value: !Sub "http://${ALB.DNSName}"

  ECSClusterName:
    Value: !Ref ECSCluster

  ECSServiceName:
    Value: !GetAtt ECSService.Name
